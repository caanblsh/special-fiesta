<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* Header */

header{
    width:100%;
    background:#fff;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.header-image{
    max-width:220px;
    width:90%;
}

/* Main */

.main-content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.content-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
}

.body-image{
    max-width:100%;
    width:650px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

/* ===========================
      Professional Button
=========================== */

.custom-button{

    position:relative;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    text-decoration:none;

    border-radius:60px;

    background:linear-gradient(135deg,#ff3b3b,#c60000);

    box-shadow:
    0 15px 35px rgba(214,0,0,.35),
    inset 0 2px 3px rgba(255,255,255,.25);

    transition:.35s;

    animation:pulse 2.2s infinite;

}

/* Shine */

.custom-button::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:60%;
    height:100%;

    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.75),
    transparent);

    transition:.8s;

}

.custom-button:hover::before{

    left:150%;

}

.custom-button:hover{

    transform:translateY(-6px) scale(1.03);

    box-shadow:
    0 20px 45px rgba(214,0,0,.45);

    animation:none;

}

.custom-button:active{

    transform:scale(.96);

}

/* Left Side */

.custom-button span:first-child{

    background:#fff;
    color:#d60000;

}

/* Right Side */

.custom-button span:last-child{

    background:#d60000;
    color:#fff;

}

/* Text */

.custom-button span{

    padding:18px 35px;

    font-size:20px;

    font-weight:800;

    letter-spacing:.5px;

    text-align:center;

    min-width:180px;

}

/* Pulse */

@keyframes pulse{

0%{
box-shadow:0 0 0 0 rgba(214,0,0,.45);
}

70%{
box-shadow:0 0 0 18px rgba(214,0,0,0);
}

100%{
box-shadow:0 0 0 0 rgba(214,0,0,0);
}

}

/* Mobile */

@media(max-width:600px){

.custom-button span{

padding:15px 20px;

font-size:17px;

min-width:135px;

}

.body-image{

width:100%;

}

}

</style>

</head>
